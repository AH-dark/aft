[package]
name = "aft-test-fake-lsp-server"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "fake-lsp-server"
path = "src/main.rs"
# The shared LSP sources this helper includes carry their own unit tests,
# which already run in the agent-file-tools suite; don't run them twice.
test = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
