name: Design gate

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]
  issues:
    types: [labeled]

jobs:
  design-gate:
    permissions:
      contents: read # fetch the gate action
      issues: read # read the linked issue's labels
      pull-requests: write # gate comment, draft conversion, ready for review
      checks: write # publish the design-gate check run
    # Pinned to a reviewed cortexkit/subconscious commit so the gate's
    # composite action and its setup actions cannot drift between reviews.
    # The gate runs every write on the job's GITHUB_TOKEN and needs no App
    # secrets, so none are passed: the org CI App key must stay reachable
    # only from private repositories.
    uses: cortexkit/subconscious/.github/workflows/design-gate.yml@6ffa19030c20bdd3816ad809d3c5e0123e07e8a8
